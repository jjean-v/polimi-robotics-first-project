/**:
  ros__parameters:
    use_sim_time: false

/basic_parameters_node:
  ros__parameters:
    robot_name: "lassie"
    enabled: true
    max_speed: 1.2
    waypoint_ids: [10, 20, 30]

/validated_parameters_node:
  ros__parameters:
    battery_threshold: 30
    target_speed: 0.7
    mode: "auto"
    dynamic_value: "hello"

/flexible_parameters_node:
  ros__parameters:
    mystery_gain: 3.14
    extra_flag: true
    labels: ["frontier", "inspection", "demo"]
